<style>
    .sponsor-embed-container {
        display: flex;

    .slider {

        overflow: hidden;
        position: relative;
        width: 100%;
        max-width: 960px;
        min-width: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
    }
    .slider:focus-visible {
        outline: 3px solid #005fcc;
        outline-offset: 2px;
    }
    .slider .slide-track {
        display: flex;
        will-change: transform;
    }
    .slider .slide {
        height: 100px;
        width: 250px;
        padding: 10px 20px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .slider .slide img {
        max-height: 100%;

        width: auto;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
    }

    .slide-label {
        height: 100px;
        width: 250px;
        padding: 10px 20px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Californian FB", Georgia, serif;
        font-size: 34px;
        line-height: 1;
        color: #fff;
        background: #1b4864;
        text-align: center;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.25);
    }

    .slide-label-plain {
        height: 100px;
        width: 250px;
        padding: 10px 20px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 34px;
        line-height: 1;
        color: #000;
        text-align: center;
        text-shadow: 0 2px 3px rgba(0, 0, 0, 0.3);
    }

    .arrow-btn {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 50%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        line-height: 1;
        color: #333;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        flex-shrink: 0;
    }
    .arrow-btn:hover {
        background: #f2f2f2;
    }
    .arrow-btn:focus-visible {
        outline: 3px solid #005fcc;
        outline-offset: 2px;
    }

    .play-pause-btn {
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 50%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: #333;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        flex-shrink: 0;
    }
    .play-pause-btn:hover {
        background: #f2f2f2;
    }
    .play-pause-btn:focus-visible {
        outline: 3px solid #005fcc;
        outline-offset: 2px;
    }

    @media (max-width: 800px) {
        .slider {
            height: 90px;
        }
        .slider .slide,
        .slide-label,
        .slide-label-plain {
            height: 70px;
            width: 160px;
            padding: 6px;
        }
        .slide-label,
        .slide-label-plain {
            font-size: 20px;
        }
        .arrow-btn {
            display: none;
        }
        .play-pause-btn {
            width: 36px;
            height: 36px;
            font-size: 15px;
        }
    }
</style>

    <script>
        const slider = document.querySelector(".slider");
        const track = document.querySelector(".slide-track");
        const originalSlides = Array.from(track.children);

        const widths = originalSlides.map((el) => el.offsetWidth);
        const totalWidth = widths.reduce((a, b) => a + b, 0);
        const stops = [];
        let acc = 0;
        widths.forEach((w) => {
            stops.push(acc);
            acc += w;
        });

        originalSlides.forEach((slide) =>
            track.appendChild(slide.cloneNode(true)),
        );
        track.style.width = totalWidth * 2 + "px";

        const cycleSeconds = 100;
        const speed = totalWidth / cycleSeconds;

        const prefersReducedMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)",
        ).matches;
        let isPlaying = !prefersReducedMotion;
        let position = 0;
        let lastTime = null;

        const playPauseBtn = document.querySelector(".play-pause-btn");
        const prevBtn = document.querySelector(".arrow-prev");
        const nextBtn = document.querySelector(".arrow-next");

        function setPosition(px) {
            position = ((px % totalWidth) + totalWidth) % totalWidth;
            track.style.transform = `translateX(-${position}px)`;
        }

        function setPlaying(playing) {
            isPlaying = playing;
            playPauseBtn.textContent = isPlaying ? "⏸" : "▶";
            playPauseBtn.setAttribute(
                "aria-label",
                isPlaying ? "Pause slider" : "Play slider",
            );
        }
        setPlaying(isPlaying);

        function animate(time) {
            if (lastTime === null) lastTime = time;
            const delta = (time - lastTime) / 1000;
            lastTime = time;
            if (isPlaying) {
                setPosition(position + speed * delta);
            }
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        function nextStop(pos) {
            for (const s of stops) {
                if (s > pos + 0.5) return s;
            }
            return stops[0] + totalWidth;
        }
        function prevStop(pos) {
            for (let i = stops.length - 1; i >= 0; i--) {
                if (stops[i] < pos - 0.5) return stops[i];
            }
            return stops[stops.length - 1] - totalWidth;
        }

        playPauseBtn.addEventListener("click", () => setPlaying(!isPlaying));
        prevBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            setPosition(prevStop(position));
        });
        nextBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            setPosition(nextStop(position));
        });

        function goToSponsors() {
            window.open(
                "https://www.foss4gna.org/2026-sponsors",
                "_blank",
                "noopener",
            );
        }
        slider.addEventListener("click", goToSponsors);
        slider.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                goToSponsors();
            }
        });
    </script>
