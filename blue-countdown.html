<style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
    .cd-wrap {
        font-family: "Inter", sans-serif;
        text-align: center;
    }
    .cd-grid {
        display: flex;
        justify-content: center;
        gap: 6px; /* CHANGED: was 10px */
        flex-wrap: wrap;
    }
    .cd-unit {
        background: #214963; /* CHANGED: was rgba(245, 245, 240, 0.6) */
        border: none; /* CHANGED: removed border and blur */
        border-radius: 2px; /* CHANGED: was 16px */
        padding: 0.5rem; /* CHANGED: was 1rem */
        min-width: 70px; /* CHANGED: was 80px */
        flex: 1;
        max-width: 100px; /* CHANGED: was 110px */
    }
    .cd-num {
        font-size: 40px;
        font-weight: 700;
        line-height: 1;
        display: block;
        font-variant-numeric: tabular-nums;
        color: #fff; /* CHANGED: was gradient text */
    }
    .cd-unit-label {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #fff; /* CHANGED: was #7a9a7a */
        font-weight: 600;
        margin-top: 4px; /* CHANGED: was 8px */
        display: block;
    }
    .cd-dot {
        font-size: 28px;
        font-weight: 300;
        color: #fff; /* CHANGED: was #c8dac8 */
        align-self: center;
        line-height: 1;
        display: flex;
        align-items: center;
        padding-top: 4px;
        animation: cd-pulse 1s ease-in-out infinite;
    }
    @keyframes cd-pulse {
        0%,
        100% {
            opacity: 1;
        }
        50% {
            opacity: 0.3;
        }
    }
</style>

<div class="cd-wrap">
    <div class="cd-grid">
        <div class="cd-unit">
            <span class="cd-num" id="cd-days">—</span
            ><span class="cd-unit-label">Days</span>
        </div>
        <div class="cd-dot">:</div>
        <div class="cd-unit">
            <span class="cd-num" id="cd-hours">—</span
            ><span class="cd-unit-label">Hours</span>
        </div>
        <div class="cd-dot">:</div>
        <div class="cd-unit">
            <span class="cd-num" id="cd-mins">—</span
            ><span class="cd-unit-label">Minutes</span>
        </div>
        <div class="cd-dot">:</div>
        <div class="cd-unit">
            <span class="cd-num" id="cd-secs">—</span
            ><span class="cd-unit-label">Seconds</span>
        </div>
    </div>
</div>

<script>
    const target = new Date("2026-11-02T08:00:00-08:00");
    function pad(n) {
        return String(Math.max(0, n)).padStart(2, "0");
    }
    function tick() {
        const diff = target - Date.now();
        if (diff <= 0) {
            ["cd-days", "cd-hours", "cd-mins", "cd-secs"].forEach(
                (id) => (document.getElementById(id).textContent = "00"),
            );
            return;
        }
        document.getElementById("cd-days").textContent = pad(
            Math.floor(diff / 86400000),
        );
        document.getElementById("cd-hours").textContent = pad(
            Math.floor((diff % 86400000) / 3600000),
        );
        document.getElementById("cd-mins").textContent = pad(
            Math.floor((diff % 3600000) / 60000),
        );
        document.getElementById("cd-secs").textContent = pad(
            Math.floor((diff % 60000) / 1000),
        );
    }
    tick();
    setInterval(tick, 1000);
</script>
